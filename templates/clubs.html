{{ define "title" }}Clubs{{ end }} {{ define "content" }}
<h2>Clubs</h2>

<p>
    {{ if .User }}
    <a href="/clubs/new" class="btn btn-primary">+ Create Club</a>
    {{ else }}
    <button onclick="requireAuth()" class="btn btn-primary">+ Create Club</button>
    {{ end }}
</p>

<!-- Search clubs -->
<div style="margin-bottom: 20px;">
    <input type="text" id="club-search" placeholder="Search clubs..." style="max-width: 400px;" oninput="filterClubs()" />
</div>

<div id="clubs-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 16px;">
    {{ range .Clubs }}
    <div class="club-card" data-name="{{ .Name }}" data-topic="{{ .Topic }}" style="border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; background: #fff;">
        <div style="display: flex; gap: 12px; align-items: flex-start">
            {{ if .ImageData }}
            <img src="/club/{{ .ID }}/image" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px;" />
            {{ end }}
            <div style="flex: 1">
                <h3 style="margin: 0 0 6px"><a href="/clubs/{{ .ID }}">{{ .Name }}</a></h3>
                <p style="margin: 0 0 6px; color: #888; font-size: 13px"><strong>Topic:</strong> {{ .Topic }}</p>
                <p style="margin: 0; color: #555; font-size: 13px">{{ .Description }}</p>
            </div>
        </div>
    </div>
    {{ else }}
    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #888;">
        <p>No clubs yet. Create one!</p>
    </div>
    {{ end }}
</div>

<script>
function filterClubs() {
    var q = document.getElementById('club-search').value.toLowerCase();
    var cards = document.querySelectorAll('.club-card');
    cards.forEach(function(card) {
        var name = (card.getAttribute('data-name') || '').toLowerCase();
        var topic = (card.getAttribute('data-topic') || '').toLowerCase();
        card.style.display = (name.indexOf(q) !== -1 || topic.indexOf(q) !== -1) ? '' : 'none';
    });
}
</script>
{{ end }}
